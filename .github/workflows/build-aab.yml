name: Build LUCHSHIY QR AAB

on:
  workflow_dispatch:

jobs:
  build:
    name: Build LUCHSHIY QR Release AAB
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find QR ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f \
            -iname 'LUCHSHIY-QR-GooglePlay-Release*.zip' \
            -o -iname 'LUCHSHIY-QR*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: LUCHSHIY QR ZIP not found!"
            exit 1
          fi

          echo "Found: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract QR project
        run: |
          rm -rf project
          mkdir project

          unzip -q "$ZIP" -d project

          echo "Project files:"
          find project -maxdepth 3 -type f | sort

      - name: Copy project files
        run: |
          cp -r project/. .

          rm -rf project

          echo "Root files:"
          ls -la

      - name: Check web application
        run: |
          if [ ! -f "package.json" ]; then
            echo "ERROR: package.json not found!"
            exit 1
          fi

          if [ ! -d "www" ]; then
            echo "ERROR: www folder not found!"
            exit 1
          fi

          echo "Project is ready."

      - name: Install dependencies
        run: |
          npm install

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Sync Android
        run: |
          npx cap sync android

      - name: Set Android application ID
        working-directory: android
        run: |
          sed -i 's/applicationId "[^"]*"/applicationId "com.luchshiy.qr"/' app/build.gradle

      - name: Build Release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Find AAB
        run: |
          find android/app/build/outputs/bundle/release \
            -type f \
            -name "*.aab"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: LUCHSHIY-QR-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
